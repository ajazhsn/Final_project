prepare:
  image_size: 224
  test_split: 0.10
  val_split: 0.15
  random_seed: 42
  min_images_per_class: 3

transform:
  augment: true
  horizontal_flip: true
  rotation_degrees: 15
  color_jitter: 0.2
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

train_svm:
  feature_type: "hog"
  hog_orientations: 9
  hog_pixels_per_cell: 8
  C: 1.0
  kernel: "rbf"
  random_seed: 42

train_mlp:
  hidden_layers: [512, 256, 128]
  dropout: 0.3
  learning_rate: 0.001
  epochs: 20
  batch_size: 32
  random_seed: 42

train_cnn:
  architecture: "efficientnet_b0"
  learning_rate: 0.001
  epochs: 20
  batch_size: 32
  fine_tune_layers: 2
  random_seed: 42

evaluate:
  metric: "macro_f1"
  threshold: 0.75